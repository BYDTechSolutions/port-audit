name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  action:
    name: GitHub Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pack this commit
        id: pack
        shell: bash
        run: |
          npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          echo "tgz=$(ls "$RUNNER_TEMP"/bydtech-port-audit-*.tgz)" >> "$GITHUB_OUTPUT"
      - name: Start the demo app
        if: runner.os != 'Windows'
        shell: bash
        run: node examples/demo-app.mjs &
      - name: Start the demo app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Process -FilePath node -ArgumentList 'examples/demo-app.mjs' -WindowStyle Hidden
      - name: Audit, report only
        id: report
        uses: ./
        with:
          package: ${{ steps.pack.outputs.tgz }}
          fail-on: none
          paths: /login
      - name: Check the outputs
        shell: bash
        env:
          FIX_NOW: ${{ steps.report.outputs.fix-now }}
          SARIF: ${{ steps.report.outputs.sarif-file }}
          JSON: ${{ steps.report.outputs.report-json }}
        run: |
          test "$FIX_NOW" -gt 0
          test -s "$SARIF"
          node -e 'const r = require(process.argv[1]); if (!r.findings.length) process.exit(1)' "$JSON"
      - name: Audit as a gate (must fail on the demo app)
        id: gate
        continue-on-error: true
        uses: ./
        with:
          package: ${{ steps.pack.outputs.tgz }}
          sarif-file: ''
      - name: Check the gate failed
        shell: bash
        env:
          OUTCOME: ${{ steps.gate.outcome }}
        run: test "$OUTCOME" = failure
