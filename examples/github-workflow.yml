# .github/workflows/port-audit.yml
# Starts the app, audits it, uploads the findings to code scanning, and fails
# the job on anything in "Fix now".
name: Port audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write # only for the SARIF upload; remove both if you skip it
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
      - name: Start the app
        run: npm start &
        env:
          PORT: '3000'
          NODE_ENV: production
      - name: Audit
        uses: BYDTechSolutions/port-audit@v0
        with:
          target: 3000
          # paths: |
          #   /login
          #   /api/health
          # fail-on: should-fix   # stricter; none never fails
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: port-audit.sarif
          category: port-audit
